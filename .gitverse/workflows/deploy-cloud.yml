name: Build and Deploy to Cloud.ru

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [ dev, staging, production ]
        default: staging
        description: 'Целевое окружение'
      image_tag:
        description: 'Тег контейнера'
        required: true
        default: 'latest'
      run_tests:
        type: boolean
        description: 'Запустить тесты перед сборкой'
        default: true

env:
  CR_URI: ${{ vars.CR_URI }}
  REPOSITORY: ${{ vars.REPOSITORY }}
  API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}
  VERSION: ${{ gitverse.sha }}

jobs:
  test:
    runs-on: self-hosted
    if: ${{ inputs.run_tests == true }}
    strategy:
      matrix:
        service: [ auth-service, team-service, project-service, task-service ]
      max-parallel: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/act
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests for ${{ matrix.service }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.service }}:test --no-daemon

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/

  build:
    runs-on: self-hosted
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    strategy:
      matrix:
        service: [api-gateway, auth-service, team-service, project-service, task-service]
      max-parallel: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/act
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR
        run: |
          echo Build JAR for ${{ matrix.service }}
          chmod +x gradlew
          ./gradlew ${{ matrix.service }}:build -x test

      - name: Log in to Cloud.ru Artifact Registry
        run: |
          docker login ${{ env.CR_URI }} -u ${{ secrets.CR_KEY_ID }} -p ${{ secrets.KEY_SECRET }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.CR_URI }}/${{ env.REPOSITORY }}:${{ matrix.service }}.${{ env.VERSION }}
            ${{ env.CR_URI }}/${{ env.REPOSITORY }}:${{ matrix.service }}.${{ inputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    runs-on: self-hosted
#    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "Creating a new '.env' configuration..."
          cat > .env <<EOF
          VERSION=${{ gitverse.sha }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          DB_USER=${{ secrets.DB_USER }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_HOST=${{ secrets.DB_HOST }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
          JWT_REALM=${{ secrets.JWT_REALM }}
          JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
          CR_URI=${{ env.CR_URI }}
          REPOSITORY=${{ env.REPOSITORY }}
          API_GATEWAY_PORT=${{ env.API_GATEWAY_PORT }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
          echo "Done!"

      - name: Copy files to VM via SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p /home/${{ secrets.DEPLOY_USER }}/quadro-deploy/"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p /home/${{ secrets.DEPLOY_USER }}/quadro-deploy/grafana"
          tar czf configs.tar.gz \
            docker-compose.yaml Dockerfile.postgres \
            loki-config.yaml prometheus.yml promtail-config.yaml servers.json \
            grafana/datasources.yaml init-scripts/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            configs.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/quadro-deploy/
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /home/${{ secrets.DEPLOY_USER }}/quadro-deploy/ && tar xzf configs.tar.gz && rm configs.tar.gz"
            rm -rf .env

      - name: Deploy to VM via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          cd /home/${{ secrets.DEPLOY_USER }}/quadro-deploy/
          echo "${{ secrets.KEY_SECRET }}" | docker login ${{ env.CR_URI }} -u ${{ secrets.CR_KEY_ID }} --password-stdin
          docker build -f Dockerfile.postgres -t postgres-with-init:latest .
          docker compose pull
          docker compose down
          docker compose --env-file .env up -d
          rm -rf .env
          EOF