name: Build and Deploy Quadro Platform

on:
  push:
    branches: [ "develop" ] # TODO: change to main when ready

env:
  VERSION: ${{ gitverse.sha }}
  REPOSITORY: ${{ vars.REPOSITORY }}

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        service:
          - api-gateway
    #          - auth-service
    #          - company-service
    #          - project-service
    #          - task-service
    #          - team-service
    #          - notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR for ${{ matrix.service }}
        run: |
          cd ./${{ matrix.service }}
          chmod +x gradlew
          ./gradlew build -x test   # -x test чтобы ускорить, можно убрать
          cd ..

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
#
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPOSITORY }}:${{ matrix.service }}-${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPOSITORY }}:${{ matrix.service }}-latest
