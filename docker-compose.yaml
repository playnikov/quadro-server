
networks:
  quadro-net:
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-postgres_data}
  kafka_data:
    name: ${KAFKA_VOLUME:-kafka_data}
  redis_data:
    name: ${REDIS_VOLUME:-redis_data}
  minio_data:
    name: ${MINIO_VOLUME:-minio_data}

x-common-env: &common-env
  APP_DATABASE_URL: ${DATABASE_URL}
  APP_DATABASE_USER: ${DB_USER}
  APP_DATABASE_PASSWORD: ${DB_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${DB_NAME}
  DB_NAME: ${DB_NAME}
  APP_DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  APP_KAFKA_BROKERS: kafka:${KAFKA_INTERNAL_PORT:-29092}
  APP_REDIS_PASSWORD: ${REDIS_PASSWORD}
  APP_JWT_SECRET: ${JWT_SECRET}
  APP_JWT_ISSUER: ${JWT_ISSUER:-quadro}
  APP_JWT_AUDIENCE: ${JWT_AUDIENCE:-quadro-api}
  APP_JWT_REALM: ${JWT_REALM:-quadro}
  APP_JWT_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION:-3600000}
  APP_JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION:-604800000}

services:
  # ========== PostgreSQL ==========
  postgres:
    image: postgres-with-init:latest
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      <<: *common-env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - quadro-net

  # ========== Kafka ==========
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT_INTERNAL:-29092}:29092"
      - "${KAFKA_PORT_EXTERNAL:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_INTERNAL_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-cx33_hoaQrG0wLT9oWx4Gw}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-controller,broker}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_VOTERS:-1@kafka:9093}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://${KAFKA_INTERNAL_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://0.0.0.0:${KAFKA_EXTERNAL_PORT:-9092},CONTROLLER://${KAFKA_CONTROLLER_HOST:-kafka}:${KAFKA_CONTROLLER_PORT:-9093}
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:${KAFKA_EXTERNAL_PORT:-9092} --list" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - quadro-net

