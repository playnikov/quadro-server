  # ========== API Gateway ==========
  auth-service:
    image: ${DOCKERHUB_USERNAME}/${REPOSITORY}:auth-service.${VERSION:-latest}
    container_name: auth-service
    restart: unless-stopped
    environment:
      <<: *common-env
      APP_DATABASE: auth_schema
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - quadro-net

  company-service:
    image: ${DOCKERHUB_USERNAME}/${REPOSITORY}:company-service.${VERSION:-latest}
    container_name: company-service
    restart: unless-stopped
    environment:
