  task-service:
    image: ${CR_URI}/${REPOSITORY}:task-service.${VERSION:-latest}
    container_name: task-service
    restart: unless-stopped
    environment:
      <<: *common-env
      APP_DATABASE: task_schema
      PORT: 8084
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - quadro-net

  api-gateway:
    image: ${CR_URI}/${REPOSITORY}:api-gateway.${VERSION:-latest}
    container_name: api-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      APP_SERVICES_AUTH: "http://auth-service:8081"
      APP_SERVICES_PROJECT: "http://project-service:8082"
      APP_SERVICES_TEAM: "http://team-service:8083"
      APP_SERVICES_TASK: "http://task-service:8084"
      APP_SERVICES_NOTIFICATION: "http://notification-service:8085"
    ports:
      - "${API_GATEWAY_PORT:-80}:8080"
    depends_on:
      - auth-service
      - team-service
      - project-service
      - task-service
    networks:
      - quadro-net