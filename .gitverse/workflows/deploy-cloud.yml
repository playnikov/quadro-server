  build:
    runs-on: self-hosted
    #    needs: test
    strategy:
      matrix:
        service: [api-gateway, auth-service, team-service, project-service, task-service]
      max-parallel: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/act
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR for ${{ matrix.service }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.service }}:build -x test

      - name: Log in to Cloud.ru Artifact Registry
        run: |
          docker login ${{ env.CR_URI }} -u ${{ secrets.CR_KEY_ID }} -p ${{ secrets.KEY_SECRET }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.CR_URI }}/${{ env.REPOSITORY }}:${{ matrix.service }}.${{ inputs.image_tag }}

  deploy:
    runs-on: cloudru-runner
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Cloud.ru Artifact Registry
        run: |
          docker login ${{ env.CR_URI }} -u ${{ secrets.CR_KEY_ID }} -p ${{ secrets.KEY_SECRET }}

      - name: Build PostgreSQL image with init scripts
        run: |
          docker build -f Dockerfile.postgres -t postgres-with-init:latest .

      - name: Create .env file
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          DB_USER=${{ secrets.DB_USER }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_HOST=${{ secrets.DB_HOST }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
          JWT_REALM=${{ secrets.JWT_REALM }}
          JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
          CR_URI=${{ env.CR_URI }}
          REPOSITORY=${{ env.REPOSITORY }}
          VERSION=${{ gitverse.event.image_tag }}
          API_GATEWAY_PORT=${{ env.API_GATEWAY_PORT }}
          EOF

      - name: Create docker secrets directory
        run: |
          mkdir -p /tmp/docker-secrets

      - name: Create secret files
        run: |
          echo "${{ secrets.POSTGRES_PASSWORD }}" > /tmp/docker-secrets/postgres_password
          echo "${{ secrets.DB_PASSWORD }}" > /tmp/docker-secrets/db_password
          echo "${{ secrets.REDIS_PASSWORD }}" > /tmp/docker-secrets/redis_password
          echo "${{ secrets.MINIO_ACCESS_KEY }}" > /tmp/docker-secrets/minio_access_key
          echo "${{ secrets.MINIO_SECRET_KEY }}" > /tmp/docker-secrets/minio_secret_key
          echo "${{ secrets.JWT_SECRET }}" > /tmp/docker-secrets/jwt_secret

      - name: Pull images from Cloud.ru
        run: |
          docker compose pull

      - name: Deploy with Docker Compose
        run: |
          docker compose down
          POSTGRES_PASSWORD_FILE=/tmp/docker-secrets/postgres_password \
          DB_PASSWORD_FILE=/tmp/docker-secrets/db_password \
          REDIS_PASSWORD_FILE=/tmp/docker-secrets/redis_password \
          MINIO_ACCESS_KEY_FILE=/tmp/docker-secrets/minio_access_key \
          MINIO_SECRET_KEY_FILE=/tmp/docker-secrets/minio_secret_key \
          JWT_SECRET_FILE=/tmp/docker-secrets/jwt_secret \
          docker compose --env-file .env up -d