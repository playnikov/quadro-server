  api-gateway:
    image: ${DOCKERHUB_USERNAME}/${REPOSITORY}:api-gateway.${VERSION:-latest}
    container_name: api-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      APP_SERVICES_AUTH: "http://auth-service:8081"
      APP_SERVICES_COMPANY: "http://company-service:8082"
      APP_SERVICES_TEAM: "http://team-service:8083"
      APP_SERVICES_PROJECT: "http://project-service:8084"
      APP_SERVICES_TASK: "http://task-service:8085"
      APP_SERVICES_NOTIFICATION: "http://notification-service:8086"
    ports:
      - "${API_GATEWAY_PORT:-80}:8080"
    depends_on:
