name: Build and Deploy to Cloud.ru

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, production]
        default: staging
        description: 'Target deployment environment'
      image_tag:
        description: 'The tag of the container'
        required: true
        default: 'latest'

env:
  CR_URI: ${{ vars.CR_URI }}
  REPOSITORY: ${{ vars.REPOSITORY }}
  API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}

