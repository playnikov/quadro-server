name: Build and Deploy Quadro Platform
#          - project-service
#          - task-service
#          - notification-service
on:
  push:
    branches: [ "develop" ] # TODO: change to main when ready

env:
  VERSION: ${{ gitverse.sha }}
  REPOSITORY: ${{ vars.REPOSITORY }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, company-service, team-service]
      max-parallel: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build JAR for ${{ matrix.service }}
        run: |
          export PATH=/opt/gradle-9.3.0/bin:$PATH
          gradle ${{ matrix.service }}:build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push docker images
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPOSITORY }}:${{ matrix.service }}.latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPOSITORY }}:${{ matrix.service }}.${{ env.VERSION }}

  deploy:
    runs-on: img-ubuntu-22.04
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build PostgreSQL image with init scripts
        run: |
          docker build -f Dockerfile.postgres -t postgres-with-init:latest .

      - name: Create .env file
        run: |
          cat > .env <<EOF
          # Docker and versions
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          REPOSITORY=${{ env.REPOSITORY }}
          VERSION=${{ env.VERSION }}
          ENVIRONMENT=production
          
          # PostgreSQL
          POSTGRES_VERSION=16
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          POSTGRES_PORT=5432
          POSTGRES_VOLUME=postgres_data
          DATABASE_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
          DB_POOL_SIZE=10
          
          # Kafka
          KAFKA_VERSION=latest
          KAFKA_PORT_INTERNAL=29092
          KAFKA_PORT_EXTERNAL=9092
          KAFKA_INTERNAL_HOST=kafka
          KAFKA_INTERNAL_PORT=29092
          KAFKA_EXTERNAL_HOST=localhost
          KAFKA_REPLICATION_FACTOR=1
          KAFKA_VOLUME=kafka_data
          
           # Redis
          REDIS_VERSION=7-alpine
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_VOLUME=redis_data
          
          # MinIO
          MINIO_VERSION=latest
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET=quadro
          MINIO_VOLUME=minio_data
          
          # JWT
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
          JWT_REALM=${{ secrets.JWT_REALM }}
          JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
          
          # API Gateway
          API_GATEWAY_PORT=80
          EOF

      - name: Deploy with Docker Compose
        run: |
          docker compose down
          docker compose up -d