name: Build and Deploy to Cloud.ru

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Список сервисов через запятую (например: api-gateway,auth-service)'
        required: true
        default: '["api-gateway","auth-service","team-service","project-service","task-service"]'
      environment:
        type: choice
        options: [ dev, staging, production ]
        default: staging
        description: 'Целевое окружение'
      image_tag:
        description: 'Тег контейнера'
        required: true
        default: 'latest'

env:
  CR_URI: ${{ vars.CR_URI }}
  REPOSITORY: ${{ vars.REPOSITORY }}
  API_GATEWAY_PORT: ${{ vars.API_GATEWAY_PORT }}

jobs:
